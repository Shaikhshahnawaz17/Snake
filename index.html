<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Snake Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --background-dark: #121212;
            --text-light: #e5e7eb;
            --card-bg: #1f2937;
            --border-radius-lg: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: none;
            user-select: none;
            padding-bottom: 20px;
        }

        /* --- Main Layout --- */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95%;
            max-width: 600px;
            margin: 20px auto;
            gap: 20px;
        }

        /* --- Header & Title --- */
        .header {
            width: 100%;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }

        /* --- Navigation Buttons (Header) --- */
        .nav-buttons-header {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-buttons-header a {
            text-decoration: none;
            padding: 12px 25px;
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--secondary-color);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .nav-buttons-header a:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            background-color: var(--secondary-color);
            color: white;
        }

        /* --- Game Area --- */
        .game-wrapper {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius-lg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        #score-display {
            color: var(--text-light);
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        #autoplay-btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #autoplay-btn.on {
            background-color: #f44336;
        }

        #game-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        #game-canvas {
            background-color: #2e2e2e;
            display: block;
            width: 100%;
            height: 100%;
            border: 2px solid var(--secondary-color);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        #controls-overlay {
            display: none;
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            border-radius: 5px;
        }

        #game-over h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 20px;
            color: #eab308;
            text-transform: uppercase;
        }

        #final-score {
            font-size: clamp(1rem, 3vw, 1.5rem);
            margin-bottom: 30px;
            font-weight: 600;
        }

        #restart-btn {
            padding: 12px 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            pointer-events: auto;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        #restart-btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* --- Navigation Buttons (Below Game) --- */
        .nav-buttons-footer {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
        }

        .nav-buttons-footer a {
            text-decoration: none;
            padding: 12px 25px;
            background-color: #E1306C;
            color: white;
            border: 1px solid #E1306C;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .nav-buttons-footer a:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            background-color: #C13584;
            color: white;
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Snake Game</h1>
        </header>
        
        <div class="nav-buttons-header">
            <a href="https://www.instagram.com/shaikhshahnawaz17/">Home</a>
            <a href="https://www.instagram.com/shaikhshahnawaz17/">About</a>
            <a href="https://www.instagram.com/shaikhshahnawaz17/">Contact Us</a>
        </div>

        <main class="game-wrapper">
            <div id="game-info">
                <div id="score-display">Score: 0</div>
                <button id="autoplay-btn">Autoplay: Off</button>
            </div>
            <div id="game-container">
                <canvas id="game-canvas"></canvas>
                <div id="controls-overlay">
                    <div class="control-info">Swipe or use arrow keys to move</div>
                </div>
                <div id="game-over">
                    <h2>Game Over!</h2>
                    <div id="final-score">Score: 0</div>
                    <button id="restart-btn">Play Again</button>
                </div>
            </div>
        </main>

        <div class="nav-buttons-footer">
            <a href="https://www.instagram.com/shaikhshahnawaz17/" target="_blank">Instagram</a>
        </div>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 20;
        const SNAKE_SPEED = 120; // milliseconds per move
        const CELL_SIZE = 20; // Fixed cell size for better control

        // Game variables
        let canvas, ctx;
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let gameInterval;
        let gameStarted = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let isChangingDirection = false;
        let isAutoplay = false;

        // Initialize the game
        function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            // Set fixed canvas size based on grid
            canvas.width = GRID_SIZE * CELL_SIZE;
            canvas.height = GRID_SIZE * CELL_SIZE;

            // Initialize game elements
            resetGame();

            // Event listeners
            document.addEventListener('keydown', handleKeyPress);
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.getElementById('restart-btn').addEventListener('click', resetGame);
            document.getElementById('autoplay-btn').addEventListener('click', toggleAutoplay);
        }

        // Toggle autoplay mode
        function toggleAutoplay() {
            isAutoplay = !isAutoplay;
            const btn = document.getElementById('autoplay-btn');
            if (isAutoplay) {
                btn.textContent = 'Autoplay: On';
                btn.classList.add('on');
            } else {
                btn.textContent = 'Autoplay: Off';
                btn.classList.remove('on');
            }
        }

        // Reset game state
        function resetGame() {
            clearInterval(gameInterval);

            // Initialize snake with 3 segments
            const startX = Math.floor(GRID_SIZE / 4) * CELL_SIZE;
            const startY = Math.floor(GRID_SIZE / 2) * CELL_SIZE;
            snake = [
                { x: startX, y: startY },
                { x: startX - CELL_SIZE, y: startY },
                { x: startX - (2 * CELL_SIZE), y: startY }
            ];

            // Reset game state
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            isChangingDirection = false;
            document.getElementById('score-display').textContent = 'Score: 0';
            document.getElementById('game-over').style.display = 'none';

            // Place first food
            placeFood();

            // Start game loop
            gameInterval = setInterval(gameLoop, SNAKE_SPEED);
            gameStarted = true;
            drawGame();
        }

        // Main game loop
        function gameLoop() {
            // If autoplay is enabled, determine the next move automatically
            if (isAutoplay) {
                const newDirection = findPath();
                if (newDirection) {
                    nextDirection = newDirection;
                }
            }

            // Update direction only once per move
            if (!isChangingDirection) {
                direction = nextDirection;
            }
            isChangingDirection = false;

            // Move snake
            const head = { ...snake[0] };

            switch (direction) {
                case 'up':
                    head.y -= CELL_SIZE;
                    break;
                case 'down':
                    head.y += CELL_SIZE;
                    break;
                case 'left':
                    head.x -= CELL_SIZE;
                    break;
                case 'right':
                    head.x += CELL_SIZE;
                    break;
            }

            // Handle endless wrapping
            if (head.x < 0) head.x = (GRID_SIZE - 1) * CELL_SIZE;
            if (head.x >= GRID_SIZE * CELL_SIZE) head.x = 0;
            if (head.y < 0) head.y = (GRID_SIZE - 1) * CELL_SIZE;
            if (head.y >= GRID_SIZE * CELL_SIZE) head.y = 0;

            // Check for collision
            if (checkSelfCollision(head)) {
                gameOver();
                return;
            }

            // Add new head
            snake.unshift(head);

            // Check if snake ate food
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score-display').textContent = `Score: ${score}`;
                placeFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            // Draw everything
            drawGame();
        }

        // BFS Pathfinding algorithm
        function findPath() {
            const queue = [{ x: snake[0].x, y: snake[0].y, path: [] }];
            const visited = new Set();
            visited.add(`${snake[0].x},${snake[0].y}`);

            while (queue.length > 0) {
                const current = queue.shift();
                const { x, y, path } = current;

                if (x === food.x && y === food.y) {
                    return path.length > 0 ? path[0] : null;
                }

                // Check possible moves
                const moves = ['up', 'down', 'left', 'right'];
                for (const move of moves) {
                    let nextX = x;
                    let nextY = y;
                    switch (move) {
                        case 'up': nextY -= CELL_SIZE; break;
                        case 'down': nextY += CELL_SIZE; break;
                        case 'left': nextX -= CELL_SIZE; break;
                        case 'right': nextX += CELL_SIZE; break;
                    }

                    // Handle wrapping for next position
                    if (nextX < 0) nextX = (GRID_SIZE - 1) * CELL_SIZE;
                    if (nextX >= GRID_SIZE * CELL_SIZE) nextX = 0;
                    if (nextY < 0) nextY = (GRID_SIZE - 1) * CELL_SIZE;
                    if (nextY >= GRID_SIZE * CELL_SIZE) nextY = 0;

                    const nextPosKey = `${nextX},${nextY}`;
                    const isCollision = snake.some(segment => segment.x === nextX && segment.y === nextY);
                    
                    if (!visited.has(nextPosKey) && !isCollision) {
                        visited.add(nextPosKey);
                        const newPath = [...path, move];
                        queue.push({ x: nextX, y: nextY, path: newPath });
                    }
                }
            }
            return null; // No path found
        }
        
        // Game over logic
        function gameOver() {
            clearInterval(gameInterval);
            document.getElementById('final-score').textContent = `Score: ${score}`;
            document.getElementById('game-over').style.display = 'flex';
        }

        // Check if snake collides with itself
        function checkSelfCollision(head) {
            // **MODIFICATION:** This function now always returns false, disabling self-collision.
            return false; 
        }

        // Place food in random position
        function placeFood() {
            food = {
                x: Math.floor(Math.random() * GRID_SIZE) * CELL_SIZE,
                y: Math.floor(Math.random() * GRID_SIZE) * CELL_SIZE
            };

            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (food.x === segment.x && food.y === segment.y) {
                    return placeFood(); // Try again
                }
            }
        }

        // Draw game elements
        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            drawGrid();

            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                ctx.fillStyle = i === 0 ? '#6366f1' : '#fff';
                ctx.fillRect(segment.x + 1.5, segment.y + 1.5, CELL_SIZE - 7, CELL_SIZE - 7);

                // Add darker border
                ctx.strokeStyle = '#4f46e5';
                ctx.lineWidth = 1;
                ctx.strokeRect(segment.x + 1, segment.y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            }

            // Draw food
            ctx.fillStyle = '#4ECDC4';
            ctx.beginPath();
            ctx.arc(
                food.x + CELL_SIZE / 2,
                food.y + CELL_SIZE / 2,
                CELL_SIZE / 2 - 1,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // Draw grid
        function drawGrid() {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;

            for (let i = 0; i <= GRID_SIZE; i++) {
                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        // Handle keyboard input
        function handleKeyPress(e) {
            if (isAutoplay) return; // Ignore input in autoplay mode

            // Prevent multiple direction changes between moves
            if (isChangingDirection) return;
            
            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') {
                        nextDirection = 'up';
                        isChangingDirection = true;
                    }
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') {
                        nextDirection = 'down';
                        isChangingDirection = true;
                    }
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') {
                        nextDirection = 'left';
                        isChangingDirection = true;
                    }
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') {
                        nextDirection = 'right';
                        isChangingDirection = true;
                    }
                    break;
            }
        }

        // Touch controls for mobile
        function handleTouchStart(e) {
            if (isAutoplay) return; // Ignore input in autoplay mode
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }

        function handleTouchMove(e) {
            if (isAutoplay || !touchStartX || !touchStartY || isChangingDirection) return;

            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            
            // Minimum swipe distance threshold
            if (Math.max(absDx, absDy) < 20) return;
            
            e.preventDefault();

            // Determine swipe direction
            if (absDx > absDy) {
                if (dx > 0 && direction !== 'left') {
                    nextDirection = 'right';
                    isChangingDirection = true;
                } else if (dx < 0 && direction !== 'right') {
                    nextDirection = 'left';
                    isChangingDirection = true;
                }
            } else {
                if (dy > 0 && direction !== 'up') {
                    nextDirection = 'down';
                    isChangingDirection = true;
                } else if (dy < 0 && direction !== 'down') {
                    nextDirection = 'up';
                    isChangingDirection = true;
                }
            }

            touchStartX = 0;
            touchStartY = 0;
        }

        // Start the game
        window.onload = init;
    </script>
</body>
</html>
